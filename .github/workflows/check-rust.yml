name: Check Rust

# Rust workspace build and tests. TypeScript and Python suites: check-typescript.yml
# and check-python.yml.
on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/sqlite.rs
      - name: Build
        run: cargo build --release --manifest-path projects/sqlite.rs/Cargo.toml --workspace
      - name: Tests
        run: cargo test --release --manifest-path projects/sqlite.rs/Cargo.toml --workspace
