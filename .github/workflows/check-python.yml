name: Check Python

# Wheel build plus a clean virtual environment run. The merged gate in
# check-typescript.yml also covers the Python suite end to end.
on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: sqlite-pyo3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/sqlite.rs
      - name: Install the wheel build tool
        run: python -m pip install --quiet "maturin>=1.7,<2.0"
      # The acceptance suite reaches the binding through the Node bridge, so
      # stage the native module before running it.
      - name: Install dependencies and stage the native binding
        run: |
          pnpm install --no-frozen-lockfile
          node scripts/build-napi.mjs
      - name: Build the wheel and run it inside a clean virtual environment
        run: node projects/sqlite.ts/packages/sqlite-harness/stages/python/run_tests.mjs
      - name: Python acceptance suite
        run: python -m unittest discover -v -s projects/sqlite.py/packages/sqlite/tests -t projects/sqlite.py/packages/sqlite/tests
