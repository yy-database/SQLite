[package]
name = "sqlite-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory SQLite format-3 database for WebAssembly (no file I/O)"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sqlite = { workspace = true }
wasm-bindgen = { workspace = true }
# `yydb-types` (pulled in by `sqlite-storage`) depends on `uuid`. Enabling the
# `js` randomness source here unifies `uuid` features for the wasm graph, where
# the default `v4` source cannot exist.
uuid = { version = "1", features = ["js"] }

# `oak-core` reaches `getrandom` 0.4 through `twox-hash`; on `wasm32-unknown-unknown`
# that backend is gated behind `wasm_js`, so unify the feature for this target only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` is not installed in this environment; sizes are reported post
# `cargo build --release` plus `wasm-bindgen` glue generation.
wasm-opt = false
