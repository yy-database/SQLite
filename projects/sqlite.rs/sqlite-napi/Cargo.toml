[package]
name = "sqlite-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for SQLite format-3 snapshot read/write (independent of YYDB)"
readme = "readme.md"
publish = false

[lib]
name = "sqlite_napi"
crate-type = ["cdylib"]
path = "src/lib.rs"

# 生产 `.node` 默认不导出 harness/图表/fuzz 符号；开发工具构建显式开启。
[features]
dev-tools = ["dep:database"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlite = { workspace = true }
database = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.napi]
name = "sqlite"
