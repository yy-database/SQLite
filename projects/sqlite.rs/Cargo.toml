[workspace]
resolver = "2"
members = [
    "sqlite-napi",
    "sqlite-pyo3",
    "sqlite-wasm",
]
default-members = ["sqlite-napi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/SQLite"

[workspace.dependencies]
# Sole aggregated core dependency for the `sqlite` facade. Pin full 40-char rev.
# Local absolute path overrides belong in `.cargo/config.toml`.
sqlite = { git = "https://github.com/oovm/database.rs.git", rev = "c72b2a7927ee7bec3a242fa7c7e88e682723f470" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6", "serde-json"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "=0.2.127"
