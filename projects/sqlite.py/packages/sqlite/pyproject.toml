[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sqlite-format3"
version = "0.1.0"
requires-python = ">=3.9"
description = "SQLite format-3 snapshot reader and writer bindings"
readme = "readme.md"
license = { text = "MPL-2.0" }

[tool.maturin]
manifest-path = "../../../sqlite.rs/sqlite-pyo3/Cargo.toml"
module-name = "sqlite_format3"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
